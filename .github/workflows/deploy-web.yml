name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Matches the emcc the build was validated with locally.
          version: 6.0.0
          # Cache the installed emsdk toolchain across runs.
          actions-cache-folder: emsdk-cache

      - name: Build (browser)
        run: make browser

      - name: Stage site
        run: |
          mkdir -p _site
          cp web/vlm.html _site/index.html
          cp web/vlm.js web/vlm.wasm _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
